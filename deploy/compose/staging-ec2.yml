# Staging EC2 — shopify embedded app + Caddy (HTTPS via sslip.io).
# Requires .env.staging at repo root on the host.

services:
  shopify:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file: ../../.env.staging
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: file:/data/dev.sqlite
    volumes:
      - shopify_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ../ec2/caddy.env
    depends_on:
      - shopify

volumes:
  shopify_data:
  caddy_data:
  caddy_config:
